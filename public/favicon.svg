<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Vinilo visto de frente. Colores fijos: un favicon no puede leer tokens.css.
       Equivalen a los tokens vinyl (#111), surco-claro (#262626) y disco-1 (#ffd23f). -->
  <circle cx="16" cy="16" r="15.5" fill="#111"/>
  <g fill="none" stroke="#262626" stroke-width="0.6">
    <circle cx="16" cy="16" r="13.5"/>
    <circle cx="16" cy="16" r="11.8"/>
    <circle cx="16" cy="16" r="10.1"/>
    <circle cx="16" cy="16" r="8.4"/>
  </g>
  <!-- Brillo de la luz sobre los surcos -->
  <path d="M6.2 9.4 A11.8 11.8 0 0 1 12.1 4.9" fill="none" stroke="#5a5a5a" stroke-width="1.4" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="5.6" fill="#ffd23f"/>
  <circle cx="16" cy="16" r="1.1" fill="#111"/>
</svg>
